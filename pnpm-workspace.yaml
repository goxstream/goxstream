packages:
  - "apps/*"
  - "packages/*"
  - "scripts/*"

catalog:
  # Runtimes & Languages
  typescript: ^6.0.2
  react: ^19.2.8
  react-dom: ^19.2.8
  "@types/react": ^19
  "@types/react-dom": ^19
  "@types/node": ^22

  # Validation & Data
  zod: ^4.6.7
  drizzle-orm: ^0.45.2
  drizzle-kit: ^0.31.10
  better-auth: ^1.7.1
  hono: ^4.13.13
  "@goxstream/goxstream-sdk": ^1.0.1

  # Cloudflare
  wrangler: ^4.125.0
  "@cloudflare/workers-types": ^5.20261012.1

  # UI & Styling
  "@base-ui/react": ^1.7.0
  "@shadcn/react": ^0.3.0
  shadcn: ^4.21.4
  tailwindcss: ^4
  "@tailwindcss/vite": ^4
  "@tailwindcss/postcss": ^4
  lucide-react: ^1.55.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^3.6.0
  cmdk: ^1.1.1
  date-fns: ^4.4.0
  embla-carousel-react: ^8.6.0
  input-otp: ^1.5.0
  next-themes: ^0.4.6
  react-day-picker: ^10.0.2
  react-resizable-panels: ^4.12.3
  recharts: 3.8.0
  tw-animate-css: ^1.4.0
  vaul: ^1.1.2

  # Tooling
  eslint: ^9.39.5
  "@eslint/js": ^9.39.5
  globals: ^16.4.0
  typescript-eslint: ^8.67.0
  eslint-plugin-react: ^7.37.0
  eslint-plugin-react-hooks: ^7.0.0
  eslint-config-next: 16.2.11
  prettier: ^3.9.9
  prettier-plugin-tailwindcss: ^0.8.1
  turbo: ^2.11.7
  tsx: ^4.19.3
  "@openapitools/openapi-generator-cli": ^2.41.0

# Pre-approve build scripts for the packages C3 itself installs that need
# them: `workerd` downloads the platform binary and `esbuild` downloads/
# builds native bindings. Without these, pnpm 11+ aborts the install with
# ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  '@openapitools/openapi-generator-cli': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

minimumReleaseAgeExclude:
  - '@goxstream/goxstream-sdk@1.0.1'
